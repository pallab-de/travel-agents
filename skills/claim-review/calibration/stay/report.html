<style>
/* The design comes from the spec's "design" object, injected at build time (build_page.py design_css):
   palette tokens for light and dark, and the two font families. Nothing about a subject is written here. */
:root{--font-display:"Fraunces", Georgia, serif;--font-body:"Plus Jakarta Sans", system-ui, sans-serif;--bg:#f5f3ee;--surface:#ffffff;--ink:#1c1f24;--mute:#555b66;--line:#e0ddd4;--accent:#9a3b2b;--accent-ink:#ffffff;--chip:#ece9e1;--good:#1f6b45;--warn:#8a5300;--bad:#a52a2a;--eyebrow:#f2d6a2;--on-image:#ffffff;--image-overlay:#1b1d22}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--surface:#1b1e23;--ink:#eceef1;--mute:#a7adb8;--line:#343842;--accent:#f0877a;--accent-ink:#121417;--chip:#262a31;--good:#5fd39a;--warn:#f0b04a;--bad:#ff8c8c;--eyebrow:#f2d6a2;--on-image:#ffffff;--image-overlay:#0c0d10}}
:root[data-theme="dark"]{--bg:#121417;--surface:#1b1e23;--ink:#eceef1;--mute:#a7adb8;--line:#343842;--accent:#f0877a;--accent-ink:#121417;--chip:#262a31;--good:#5fd39a;--warn:#f0b04a;--bad:#ff8c8c;--eyebrow:#f2d6a2;--on-image:#ffffff;--image-overlay:#0c0d10}
:root { --gutter: 20px; --maxw: 1160px; --radius: 16px; --display: var(--font-display, Georgia), serif; --body: var(--font-body, system-ui), sans-serif; color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
html.js { scroll-behavior: smooth; }
body { overflow-x: hidden; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--body); font-feature-settings: "kern", "liga"; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }
img { max-width: 100%; height: auto; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; text-wrap: balance; margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* Top bar: wordmark, section links, one icon for the theme. */
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; gap: 18px; align-items: center; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.topnav { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.topnav::-webkit-scrollbar { display: none; }
.topnav a { color: var(--mute); text-decoration: none; font-size: 14px; white-space: nowrap; }
.topnav a:hover { color: var(--ink); }
#themeBtn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; color: var(--ink); }
#themeBtn:hover { border-color: var(--accent); }

/* Hero: full-bleed photo, the title and lead written over it, a scroll-linked parallax. */
.hero { position: relative; width: 100vw; margin-inline: calc(50% - 50vw); height: min(84vh, 760px); min-height: 500px; overflow: hidden; color: var(--on-image); background: var(--image-overlay); isolation: isolate; }
.hero-bg { position: absolute; inset: -12% 0 auto 0; width: 100%; height: 124%; object-fit: cover; z-index: -2; transform: translate3d(0, var(--parallax, 0px), 0); will-change: transform; }
.hero-scrim { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, color-mix(in srgb, var(--image-overlay) 35%, transparent) 0%, color-mix(in srgb, var(--image-overlay) 40%, transparent) 40%, var(--image-overlay) 100%); }
.hero-copy { position: absolute; left: 0; right: 0; bottom: clamp(56px, 12vh, 120px); }
.hero-copy .wrap { padding-bottom: 0; }
.eyebrow { font: 600 12px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--eyebrow); }
.hero h1 { font-size: clamp(40px, 6.2vw, 80px); line-height: 1.02; margin: 14px 0 18px; max-width: 18ch; font-weight: 800; }
.hero .lead { font-size: clamp(17px, 1.6vw, 20px); max-width: 52ch; margin: 0; opacity: .92; }
.hero-credit { position: absolute; right: var(--gutter); bottom: 74px; font-size: 11px; color: var(--on-image); opacity: .7; margin: 0; z-index: 1; }

/* KPI band: sits across the foot of the hero. Counters count up when they come into view. */
.kpi-band { position: relative; z-index: 2; margin-top: -64px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 16px; box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .35); }
.kpi b { display: block; font: 800 clamp(26px, 3vw, 34px)/1.05 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi span { display: block; margin-top: 6px; color: var(--mute); font-size: 13.5px; line-height: 1.4; }
.ethos { margin: 26px 0 0; font: 400 clamp(19px, 2vw, 24px)/1.4 var(--display); font-style: italic; color: var(--ink); max-width: 48ch; }
.ethos::before { content: ""; display: block; width: 44px; height: 3px; background: var(--accent); margin-bottom: 14px; border-radius: 2px; }

/* Notice block as an editorial ledger: numbered rows between hairlines. No boxes, no card chrome. */
.notice-head { margin: 64px 0 18px; }
.kicker { font: 600 12px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.notice-head h2 { font-size: clamp(28px, 3.2vw, 38px); margin-top: 10px; }
.ledger { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.ledger li { display: grid; grid-template-columns: minmax(48px, 72px) minmax(0, 1fr); gap: 8px 24px; align-items: baseline; padding: 22px 0; border-bottom: 1px solid var(--line); }
.ledger .n { font: 700 clamp(26px, 2.6vw, 34px)/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.ledger p { margin: 0; font-size: clamp(16px, 1.3vw, 18px); line-height: 1.55; max-width: 64ch; }

/* Sections */
.section { margin-top: 64px; }
.section > header h2 { font-size: clamp(28px, 3.4vw, 40px); margin-top: 8px; }
.section > header p { color: var(--mute); margin: 10px 0 22px; max-width: 64ch; }

/* Card block */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: transform .25s ease, box-shadow .25s ease, opacity .8s ease; }
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px -20px rgba(0, 0, 0, .35); }
.card.is-unavailable { opacity: .7; }
.grid tr.is-unavailable td { opacity: .7; }
.gallery { display: flex; flex-direction: column; gap: 6px; margin: -16px -16px 0; }
.card .cover { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius) var(--radius) 0 0; background: var(--chip); }
.gallery .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 4px; }
.gallery .thumb { padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--chip); cursor: pointer; aspect-ratio: 4 / 3; transition: transform .2s ease, border-color .2s ease; }
.gallery .thumb:hover { transform: scale(1.04); }
.gallery .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.gallery .thumb[aria-pressed="true"] { border-color: var(--accent); }
.card .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card h3 { font-size: 22px; line-height: 1.2; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.rank { font: 700 12px/1 var(--body); color: var(--accent); letter-spacing: .08em; white-space: nowrap; }
.score { font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.area { color: var(--mute); font-size: 13.5px; }
.price { font: 700 19px/1.2 var(--body); font-variant-numeric: tabular-nums; }
.price small { font-weight: 400; color: var(--mute); font-size: 12px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 10px; }
.badge.good { color: var(--good); border-color: var(--good); background: transparent; }
.badge.warn { color: var(--warn); border-color: var(--warn); background: transparent; }
.badge.bad { color: var(--bad); border-color: var(--bad); background: transparent; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 0; }
.facts div { min-width: 0; }
.facts div.wide { grid-column: 1 / -1; }
.facts dt { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.card ul { margin: 0; padding-left: 18px; font-size: 14.5px; }
.card h4 { font: 600 11.5px/1.2 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 6px 0 2px; }
.verdict { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14.5px; }
.details { align-self: flex-start; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer; }
.details:hover { background: var(--accent); color: var(--accent-ink); }

/* Table block */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.tools input[type="search"] { flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tools select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-width: 100%; }
.tools .count { color: var(--mute); font-size: 13px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table.grid { width: 100%; border-collapse: collapse; font-size: 14.5px; min-width: 760px; }
table.grid th, table.grid td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.grid th { font: 600 11.5px/1.2 var(--body); color: var(--mute); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
table.grid th button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid tbody tr { transition: background-color .15s ease; }
table.grid tbody tr:hover { background: var(--chip); }
table.grid tr:last-child td { border-bottom: 0; }
table.grid tbody tr.has-details { cursor: pointer; }
table.grid tr.grp th { background: var(--chip); color: var(--ink); text-transform: none; letter-spacing: 0; font: 600 13.5px/1.3 var(--body); }
table.grid td.sel, table.grid th.sel { width: 36px; text-align: center; }
.muted { color: var(--mute); }

/* Table tools: filter menus, column chooser, group-by, compare. One popover idiom for all of them. */
.tool { position: relative; }
.tool > button, .tools .btn { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.tool > button[aria-expanded="true"], .tool > button.is-active { border-color: var(--accent); color: var(--accent); }
.menu { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; min-width: 200px; max-width: min(320px, 86vw); max-height: 320px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: 0 18px 40px -20px rgba(0, 0, 0, .4); display: grid; gap: 6px; font-size: 14px; }
.menu label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.menu .range { display: flex; gap: 6px; align-items: center; }
.menu .range input { width: 90px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.menu .clear { justify-self: start; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; }

/* Chart block: a scatter of two numeric columns of a table. Drawn as inline SVG from the spec's own rows. */
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .axis { stroke: var(--line); }
.chart .tick { fill: var(--mute); font: 11px var(--body); }
.chart .lbl { fill: var(--ink); font: 600 12px var(--body); }
.chart .pt { fill: var(--accent); fill-opacity: .8; stroke: var(--surface); stroke-width: 1.5; cursor: pointer; transition: r .15s ease; }
.chart .pt:hover, .chart .pt:focus { r: 8; fill-opacity: 1; outline: none; }
.chart .pt.is-unavailable { fill: var(--mute); }

/* Itinerary blocks: day plan, transport leg, booking ledger. Same tokens/hairline-and-ledger idiom as
   the notice block and cards, not a second visual language. */
.day-plan { display: grid; gap: 28px; }
.day h3 { font-size: 20px; margin-bottom: 10px; }
.stops { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.stops .stop { display: grid; grid-template-columns: minmax(64px, 88px) 1fr; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.stops .stop .time { font: 700 13px/1.3 var(--body); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stops .stop b { font-size: 15.5px; }
.stops .stop p { margin: 4px 0 0; color: var(--mute); font-size: 14px; }
.transport-legs { display: grid; gap: 24px; }
.leg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.leg h3 { font-size: 18px; margin-bottom: 10px; }
.modes { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.modes li { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; padding: 6px 10px; border-radius: 10px; }
.modes li b { text-transform: capitalize; }
.modes li.is-recommended { background: var(--chip); }
.modes li.is-recommended b { color: var(--accent); }
.modes li span { color: var(--mute); font-variant-numeric: tabular-nums; }

/* Status badges, decision log, research notes and cost comparison: more blocks in the same hairline-and-ledger idiom. */
.status { display: inline-block; font: 600 11.5px/1.5 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--mute); vertical-align: middle; margin-left: 8px; white-space: nowrap; }
.status--booked, .status--confirmed, .status--paid { color: var(--good); border-color: var(--good); }
.status--held, .status--open, .status--upcoming { color: var(--warn); border-color: var(--warn); }
.status--cancelled, .status--rejected { color: var(--bad); border-color: var(--bad); }
.stops .stop.is-off b { font-weight: 500; color: var(--mute); }
.log { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.log li { display: grid; grid-template-columns: minmax(84px, 130px) minmax(0, 1fr); gap: 6px 24px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.log .when { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
.log b { display: block; font-size: 16px; }
.log p { margin: 4px 0 0; color: var(--mute); font-size: 14.5px; max-width: 64ch; }
.notes { display: grid; gap: 14px; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
.note h3 { font-size: 17px; margin-bottom: 6px; }
.note p { margin: 0 0 6px; }
.note .src, .note .gap { font-size: 12.5px; color: var(--mute); margin: 0; }
.cost-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.cost { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.cost.is-recommended { border-color: var(--accent); }
.cost h3 { font-size: 18px; }
.cost .price { font: 800 24px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.cost .mech { color: var(--mute); font-size: 14px; margin: 0; }

/* Method and footer */
.method { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; }
.method ol, .method ul { padding-left: 20px; margin: 0; }
.method li + li { margin-top: 8px; }
footer.pg { color: var(--mute); font-size: 13px; margin: 56px 0 0; border-top: 1px solid var(--line); padding: 16px 0 36px; }

/* Details panel: one native <dialog>, filled from the card's dossier. */
dialog.dossier { width: min(760px, calc(100% - 24px)); max-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); padding: 0; }
dialog.dossier::backdrop { background: rgba(10, 10, 12, .55); }
dialog.dossier .dhead { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
dialog.dossier .dhead h2 { font-size: 22px; }
dialog.dossier .dclose, dialog.dossier .dstep { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
dialog.dossier .dnav { display: flex; gap: 6px; align-items: center; }
dialog.dossier .dstep[disabled] { opacity: .4; cursor: default; }
dialog.dossier .cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
dialog.dossier .cmp th, dialog.dossier .cmp td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
dialog.dossier .cmp thead th { font: 700 15px/1.25 var(--display); color: var(--ink); }
dialog.dossier .cmp tbody th { color: var(--mute); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
dialog.dossier .dbody { padding: 6px 20px 22px; display: grid; gap: 24px; }
dialog.dossier section h3 { font: 600 12px/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--mute); margin: 0 0 10px; }
dialog.dossier .src { font-size: 12px; color: var(--mute); margin-top: 6px; }
dialog.dossier .facts { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; gap: 6px 14px; }
dialog.dossier .facts dt { color: var(--mute); font-size: 13px; text-transform: none; letter-spacing: 0; }
dialog.dossier .facts dd { font-size: 14px; }
dialog.dossier .rv { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: 14.5px; }
dialog.dossier .rv:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
dialog.dossier .rv b { display: block; }
dialog.dossier .rv small { color: var(--mute); }
dialog.dossier .score-line { font-size: 15px; margin-bottom: 6px; }
dialog.dossier .score-line b { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; }
dialog.dossier .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
dialog.dossier .photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: var(--chip); }
dialog.dossier .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
dialog.dossier .tbl th, dialog.dossier .tbl td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
dialog.dossier .tbl th { color: var(--mute); font-weight: 600; font-size: 12px; }
dialog.dossier .notfound { color: var(--warn); font-size: 14px; }

/* Motion. Only when the viewer allows it, and only once the script has marked the page as running (html.js). */
@media (prefers-reduced-motion: no-preference) {
  html.js [data-reveal] { opacity: 0; transform: translate3d(0, 22px, 0); transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .8s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0ms); }
  html.js [data-reveal].is-in { opacity: 1; transform: none; }
  html.js .ledger li[data-reveal] { transform: translate3d(-18px, 0, 0); transition: opacity .7s cubic-bezier(.2, .7, .2, 1), transform .7s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0ms); }
  html.js .ledger li[data-reveal].is-in { transform: none; }
  html.js .card[data-reveal] { transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .25s ease, box-shadow .25s ease; }
  html.js .card[data-reveal].is-in:hover { transform: translateY(-4px); }
  dialog.dossier[open] { animation: rise .25s ease backwards; }

<script>
/*
 * Generic ranked-report engine. The page is an ordered list of blocks in the spec, plus a design object:
 *   design {brand, ethos, palette:{...}, palette_dark:{...}, fonts:{display, body}}   (required; build refuses without it)
 *   hero   {eyebrow, title, lead, kpis:[{value,label}], image, image_alt, image_credit}   (image required, https)
 *   notice {title, items:[text]}                          rendered as an editorial ledger (numbered rows, no boxes)
 *   cards  {id, kicker, title, intro, items:[item]}       item: {name,url,area,rank,score,score_basis,price,priceNote,
 *                                                          unavailable,images:[url],badges:[{text,tone}],
 *                                                          facts:[{label,value}], pros:[], watch:[], verdict, dossier:[section]}
 *   table  {id, kicker, title, intro, cards:<cards block id its rows open>, columns:[{key,label,type:'num'|'text'|'cat',filter,hidden,link}],
 *           group_by:[key], compare:bool, items:[item]}
 *   chart  {id, kicker, title, intro, source:<table id>, x:{key,label}, y:{key,label}}   (scatter of two num columns)
 *   method {id, title, items:[text]}
 *   day_plan       {id, kicker, title, intro, days:[{date, label, city, stops:[{time,name,note,url,type,fixed,
 *                    price,source,leg}]}]}
 *   transport_leg  {id, kicker, title, intro, legs:[{label, from, to, modes:[{mode,time_minutes,distance_km,cost,
 *                    note,source,captured_at,segments:[{label,time_minutes,main,source,captured_at}]}],
 *                    recommendation:{mode,reasons:[text]}}]}
 *   booking_ledger {id, kicker, title, intro, bookings:[{name,category,amount,currency,status,cancel_by,
 *                    check_in,check_out,date,note,url,source}], summary:{<currency>: total}}
 *   decision_log  {id, kicker, title, intro, entries:[{date, title, decision, why, status:'decided'|'open'|'superseded'}]}
 *   research_notes {id, kicker, title, intro, notes:[{topic, finding, sources:[{name,url,read_at}], not_verified}]}
 *   cost_comparison {id, kicker, title, intro, options:[{label, cash:{amount,currency}, points:{amount,programme},
 *                    mechanic, url, source, captured_at}], recommendation:{option, reasons:[text]}}
 *   A day_plan stop and a booking may carry status: booked|held|open|cancelled|rejected (a badge; a rejected option
 *   stays in the document with its reason in note). spec.locale (e.g. "en-GB") sets how amounts are formatted.
 *   footer text
 * Items are plain data: the engine knows nothing about the subject.
 */
document.documentElement.classList.add('js');
const SPEC = JSON.parse(document.getElementById('spec').textContent);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
/* Only http(s) links are rendered; anything else (javascript:, data:) becomes no link. */
const safeUrl = u => {
  const s = String(u ?? '').trim();
  const t = s.replace(/[\u0000- \u007f-\u009f]/g, '');   /* browsers ignore control characters and spaces inside a scheme: judge the URL as the browser reads it */
  if (!t || t.startsWith('//') || t.startsWith('\\')) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(t)) return s;               /* relative: the build's own ./<stem>_assets/ paths */
  try { const p = new URL(t); return /^https?:$/.test(p.protocol) ? p.href : ''; } catch (e) { return ''; }
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = SPEC.design || {};

/* Theme: system by default; the icon shows the theme the click will switch to. */
const themeBtn = $('#themeBtn');
const curTheme = () => document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const ICON_MOON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function paintTheme() {
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  themeBtn.innerHTML = next === 'dark' ? ICON_MOON : ICON_SUN;
  themeBtn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
  themeBtn.title = 'Switch to ' + next + ' theme';
}
themeBtn.onclick = () => { document.documentElement.setAttribute('data-theme', curTheme() === 'dark' ? 'light' : 'dark'); paintTheme(); };
paintTheme();

/* Brand wordmark from the design. */
$('#brand').textContent = D.brand || '';
document.title = (((SPEC.blocks || []).find(b => b.type === 'hero') || {}).title || D.brand || 'Report') + (D.brand ? ' \u2014 ' + D.brand : '');

const sectionIds = [];
function frame(id, kicker, title, intro, body) {
  sectionIds.push([id, title]);
  return `<section class="section" id="${esc(id)}"><header data-reveal>${kicker ? `<div class="kicker">${esc(kicker)}</div>` : ''}<h2>${esc(title)}</h2>${intro ? `<p>${esc(intro)}</p>` : ''}</header>${body}</section>`;
}
const DOSSIERS = [];  // details-panel data, indexed by data-dossier on each card
const DOSSIER_BY_KEY = {};   // panels by cards-block id + item id, so two items sharing a name keep their own
const DOSSIER_BY_NAME = {};  // the same panels, found by item name from a table row or a chart point
/* A table row or chart point opens the card it belongs to: by cards-block id and item id when the table names its
   cards block (`cards`), else by name. */
const dossierFor = (bid, r) => (bid != null ? DOSSIER_BY_KEY[bid + '|' + (r.id ?? r.name)] : null) ?? DOSSIER_BY_NAME[r.name];
const toneCls = t => ['good', 'warn', 'bad'].includes(t) ? ' ' + t : '';
const STATUS = ['booked', 'held', 'open', 'cancelled', 'rejected', 'confirmed', 'upcoming', 'paid'];
const statusBadge = v => { const k = String(v || '').toLowerCase(); return k ? `<span class="status${STATUS.includes(k) ? ' status--' + k : ''}">${esc(v)}</span>` : ''; };
/* Amounts are formatted in the spec's locale; a currency the browser cannot format falls back to the plain figure. */
const money = (amount, cur) => {
  const n = Number(amount);
  if (!Number.isFinite(n)) return esc(amount) + (cur ? ' ' + esc(cur) : '');
  try { return esc(new Intl.NumberFormat(SPEC.locale || undefined, {style: 'currency', currency: cur}).format(n)); }
  catch (e) { return esc(n) + (cur ? ' ' + esc(cur) : ''); }
};


/* Hero: the photo is full bleed; the title, lead and KPIs sit over it. The KPI band overlaps the foot of the hero. */
function heroBlock(h) {
  const img = safeUrl(h.image);
  const kpis = (h.kpis || []).map(k => `<div class="kpi" data-reveal><b data-count>${esc(k.value)}</b><span>${esc(k.label)}</span></div>`).join('');
  return `<header class="hero" id="top">
      ${img ? `<img class="hero-bg" data-parallax src="${esc(img)}" alt="${esc(h.image_alt || '')}" loading="eager" onerror="this.hidden=true">` : ''}
      <div class="hero-scrim"></div>
      <div class="hero-copy"><div class="wrap">
        <div class="eyebrow" data-reveal>${esc(h.eyebrow || '')}</div>
        <h1 data-reveal style="--d:120ms">${esc(h.title)}</h1>
        <p class="lead" data-reveal style="--d:240ms">${esc(h.lead || '')}</p>
      </div></div>
      ${h.image_credit ? `<p class="hero-credit">${esc(h.image_credit)}</p>` : ''}
    </header>
    <div class="wrap kpi-band"><div class="kpis">${kpis}</div>${D.ethos ? `<p class="ethos" data-reveal>${esc(D.ethos)}</p>` : ''}</div>`;
}
function noticeBlock(n) {
  const rows = (n.items || []).map((t, i) => `<li data-reveal style="--d:${i * 110}ms"><span class="n">${String(i + 1).padStart(2, '0')}</span><p>${esc(t)}</p></li>`).join('');
  return `<section class="notice-block"><div class="notice-head" data-reveal><div class="kicker">Before you read the numbers</div><h2>${esc(n.title)}</h2></div><ol class="ledger">${rows}</ol></section>`;
}
function cardHTML(it, bid) {
  const badges = (it.badges || []).map(b => `<span class="badge${toneCls(b.tone)}">${esc(b.text)}</span>`).join('');
  const facts = (it.facts || []).map(f => `<div class="${String(f.value ?? '').length > 36 ? 'wide' : ''}"><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join('');
  // A watch-out may be {text, review_ids, isolated}: an isolated one is labelled, so one guest's complaint never
  // reads as a pattern.
  const item = x => (x && typeof x === 'object')
    ? `${esc(x.text)}${x.isolated ? ' <small class="muted">(one report)</small>' : ''}` : esc(x);
  const list = (arr, empty) => `<ul>${(arr && arr.length ? arr : [empty]).map(x => `<li>${item(x)}</li>`).join('')}</ul>`;
  const link = safeUrl(it.url);
  const dIdx = it.dossier ? (DOSSIER_BY_KEY[bid + '|' + (it.id ?? it.name)] ?? DOSSIER_BY_NAME[it.name]) : -1;
  const title = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(it.name)}</a>` : esc(it.name);
  const pics = (it.images || []).map(safeUrl).filter(Boolean).slice(0, 4);
  const cover = pics.length ? `<div class="gallery"><img class="cover" src="${esc(pics[0])}" alt="${esc(it.name)}, photo 1" loading="lazy" onerror="this.closest('.gallery').hidden=true"><div class="thumbs">${pics.slice(1).map((p, i) => `<button type="button" class="thumb" aria-label="Show photo ${i + 2}"><img src="${esc(p)}" alt="" loading="lazy" onerror="this.closest('button').hidden=true"></button>`).join('')}</div></div>` : '';
  return `<article class="card${it.unavailable ? ' is-unavailable' : ''}" data-reveal>
    ${cover}
    <div class="head"><div><div class="rank">#${esc(it.rank)}</div><h3>${title}</h3><div class="area">${esc(it.area || '')}</div></div>${it.score != null ? `<div class="score" title="${(it.score_basis && (it.score_basis.group_fit || []).length) ? 'Rank score: the guest score read from reviews, adjusted for what this group asked for' : 'Guest score, read from reviews'}">${esc(it.score)}</div>` : ''}</div>
    ${it.price != null ? `<div class="price">${esc(it.price)} <small>${esc(it.priceNote || '')}</small></div>` : ''}
    <div class="badges">${badges}</div>
    <dl class="facts">${facts}</dl>
    <h4>Why it ranks</h4>${list(it.pros, 'See verdict')}
    <h4>Watch-outs</h4>${list(it.watch, 'None recorded')}
    ${it.verdict ? `<p class="verdict"><b>Verdict.</b> ${esc(it.verdict)}</p>` : ''}
    ${dIdx >= 0 ? `<button type="button" class="details" data-dossier="${dIdx}">View details</button>` : ''}
  </article>`;
}
function cardsBlock(s) {
  return frame(s.id, s.kicker, s.title, s.intro, `<div class="cards">${s.items.map(it => cardHTML(it, s.id)).join('')}</div>`);
}

/* Details panel renderer: one shared <dialog>, filled from the card's dossier. Every value is escaped. */
const dlg = document.createElement('dialog');
dlg.className = 'dossier';
dlg.setAttribute('aria-labelledby', 'dossier-title');
document.body.appendChild(dlg);
const dossierSection = sec => {
  const src = sec.source || (sec.sources || []).find(Boolean);
  const srcHtml = src ? `<div class="src">Source: <a href="${esc(safeUrl(src) || '#')}" target="_blank" rel="noopener">${esc(src)}</a></div>` : '';
  const nf = sec.not_found ? `<p class="notfound">Not collected: ${esc(sec.not_found)}</p>` : '';
  let body = '';
  if (sec.kind === 'facts') {
    body = (sec.rows || []).length ? `<dl class="facts">${sec.rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : '';

      const isRec = l.recommendation && l.recommendation.mode === m.mode;
      const segs = (m.segments || []).map(sg => `${esc(sg.label)} ${Math.round(Number(sg.time_minutes))} min`).join(' + ');
      return `<li${isRec ? ' class="is-recommended"' : ''}><b>${esc(m.mode)}</b><span>${bits.length ? bits.join(' · ') : esc(m.note || 'not viable')}${segs ? `<br><small class="muted">${segs}</small>` : ''}</span></li>`;
    }).join('');
    const rec = l.recommendation ? `<p class="verdict"><b>${esc(l.recommendation.mode)}.</b> ${esc((l.recommendation.reasons || []).join(' '))}</p>` : '';
    return `<div class="leg" data-reveal><h3>${esc(l.label)}</h3><ul class="modes">${modes}</ul>${rec}</div>`;
  }).join('');
  return frame(s.id, s.kicker, s.title, s.intro, `<div class="transport-legs">${legs}</div>`);
}
function bookingLedgerBlock(s) {
  const rows = (s.bookings || []).map(b => {
    const link = safeUrl(b.url);
    const name = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(b.name)}</a>` : esc(b.name);
    const when = [b.check_in, b.check_out].filter(Boolean).join(' to ') || b.date || '';
    return `<tr><td>${name}${when ? `<br><small class="muted">${esc(when)}</small>` : ''}${b.note ? `<br><small class="muted">${esc(b.note)}</small>` : ''}</td><td>${esc(b.category || '')}</td><td class="num">${money(b.amount, b.currency)}</td><td>${statusBadge(b.status)}</td><td>${esc(b.cancel_by || '')}</td></tr>`;
  }).join('');
  const totals = {};
  (s.bookings || []).forEach(b => { if (b.status === 'cancelled' || b.status === 'rejected') return; const c = b.currency || ''; const n = Number(b.amount); if (Number.isFinite(n)) totals[c] = (totals[c] || 0) + n; });
  const totalLine = Object.entries(totals).map(([c, v]) => money(v, c)).join(', ') || 'no bookings yet';
  const body = `<div class="tablewrap"><table class="grid"><thead><tr><th>Booking</th><th>Category</th><th>Amount</th><th>Status</th><th>Cancel by</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted" style="margin-top:10px">Total (cancelled and rejected bookings left out): ${totalLine}</p>`;
  return frame(s.id, s.kicker, s.title, s.intro, body);
}

/* Decision log: what was decided, when, and why. A superseded decision stays, marked, so nobody re-argues it. */
function decisionLogBlock(s) {
  const rows = (s.entries || []).map(e => `<li data-reveal><span class="when">${esc(e.date || '')}</span><div><b>${esc(e.title)}${statusBadge(e.status)}</b><p>${esc(e.decision)}${e.why ? ' ' + esc(e.why) : ''}</p></div></li>`).join('');
  return frame(s.id, s.kicker, s.title, s.intro, `<ol class="log">${rows}</ol>`);
}
/* Research notes: a finding, where it was read and when, and what was not checked. */
function researchNotesBlock(s) {
  const notes = (s.notes || []).map(n => {
    const src = (n.sources || []).map(x => { const u = safeUrl(x.url); const nm = esc(x.name || x.url); return (u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${nm}</a>` : nm) + (x.read_at ? ` (read ${esc(x.read_at)})` : ''); }).join(' · ');
    return `<article class="note" data-reveal><h3>${esc(n.topic)}</h3><p>${esc(n.finding)}</p><p class="src">${src}</p>${n.not_verified ? `<p class="gap">Not verified: ${esc(n.not_verified)}</p>` : ''}</article>`;
  }).join('');
  return frame(s.id, s.kicker, s.title, s.intro, `<div class="notes">${notes}</div>`);
}
/* Cost comparison: each option's cash price, its points price when it has one, and how the money actually moves. */
function costComparisonBlock(s) {
  const rec = s.recommendation || {};
  const opts = (s.options || []).map(o => {
    const link = safeUrl(o.url);
    const label = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(o.label)}</a>` : esc(o.label);
    const pts = o.points ? `<div>${esc(Number(o.points.amount).toLocaleString(SPEC.locale || undefined))} ${esc(o.points.programme || 'points')}</div>` : '';
    return `<div class="cost${rec.option === o.label ? ' is-recommended' : ''}" data-reveal><h3>${label}</h3><div class="price">${o.cash ? money(o.cash.amount, o.cash.currency) : ''}</div>${pts}<p class="mech">${esc(o.mechanic)}</p></div>`;
  }).join('');
  const verdict = rec.option ? `<p class="verdict"><b>${esc(rec.option)}.</b> ${esc((rec.reasons || []).join(' '))}</p>` : '';
  return frame(s.id, s.kicker, s.title, s.intro, `<div class="cost-options">${opts}</div>${verdict}`);
}

/* Assemble the page from the ordered block list. Card details are registered first, so a table or chart anywhere
   on the page (even above the cards) can open them. */
SPEC.blocks.filter(b => b.type === 'cards').forEach(b => b.items.forEach(it => {
  if (!it.dossier) return;
  const idx = DOSSIERS.push({name: it.name, sections: it.dossier}) - 1;
  DOSSIER_BY_KEY[b.id + '|' + (it.id ?? it.name)] = idx;
  if (DOSSIER_BY_NAME[it.name] == null) DOSSIER_BY_NAME[it.name] = idx;
}));
const blocks = [];
const page = $('#page');
let html = '';
for (const b of SPEC.blocks) {
 try {
  if (b.type === 'hero') html += heroBlock(b);
  else if (b.type === 'notice') html += noticeBlock(b);
  else if (b.type === 'cards') html += cardsBlock(b);
  else if (b.type === 'table') { html += tableBlock(b); blocks.push(b); }
  else if (b.type === 'method') html += methodBlock(b);
  else if (b.type === 'day_plan') html += dayPlanBlock(b);
  else if (b.type === 'transport_leg') html += transportLegBlock(b);
  else if (b.type === 'booking_ledger') html += bookingLedgerBlock(b);
  else if (b.type === 'chart') html += chartBlock(b);
  else if (b.type === 'decision_log') html += decisionLogBlock(b);
  else if (b.type === 'research_notes') html += researchNotesBlock(b);
  else if (b.type === 'cost_comparison') html += costComparisonBlock(b);
  else throw new Error('Unknown block type: ' + b.type);
 } catch (e) {   /* one bad block shows a notice here instead of blanking the whole page */
  html += `<section class="wrap" role="alert"><p>This section (${esc(b && b.type)}) could not be shown: ${esc(e && e.message)}</p></section>`;
 }
}
if (SPEC.footer) html += `<footer class="pg">${esc(SPEC.footer)}</footer>`;
page.innerHTML = html;
blocks.forEach(b => wireTable(b.id));
$('#topnav').innerHTML = sectionIds.map(([id, t]) => `<a href="#${esc(id)}">${esc(t)}</a>`).join('');

/* Motion. With reduced motion, nothing is hidden and nothing moves; the text is always the spec's own text. */
if (reduceMotion) {
  document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('is-in'));
} else {
  /* Things reveal as they enter the viewport; the stagger is the --d delay each element carries. */
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('is-in');
    e.target.querySelectorAll('[data-count]').forEach(countUp);
    if (e.target.matches('[data-count]')) countUp(e.target);
    io.unobserve(e.target);
  }), {threshold: 0.2, rootMargin: '0px 0px -8% 0px'});
  document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));

  /* KPI counters: count up to the spec's value once; the element ends with the spec's exact text. */
  function countUp(b) {
    if (b.dataset.done) return;
    b.dataset.done = '1';
    const text = b.textContent.trim();
    const m = text.match(/^([^\d-]*)(-?[\d,]+(?:\.(\d+))?)(.*)$/);
    if (!m) return;
    const target = parseFloat(m[2].replace(/,/g, ''));
    const decimals = m[3] ? m[3].length : 0;
    const fmt = v => m[1] + (decimals ? v.toFixed(decimals) : Math.round(v).toLocaleString('en-US')) + m[4];
    const t0 = performance.now(), dur = 1400;
    const tick = now => {
      const p = Math.min(1, (now - t0) / dur), eased = 1 - Math.pow(1 - p, 4);
      b.textContent = p < 1 ? fmt(target * eased) : text;
      if (p < 1) requestAnimationFrame(tick);
    };
    b.textContent = fmt(0);
    requestAnimationFrame(tick);
  }

  /* Parallax: the hero photo drifts at a fraction of the scroll speed, and only while the hero is on screen. */
  const hero = document.querySelector('.hero'), bg = document.querySelector('[data-parallax]');
  if (hero && bg) {
    let queued = false;
    const onScroll = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        const y = Math.max(0, Math.min(hero.offsetHeight, window.scrollY));
        bg.style.setProperty('--parallax', (y * 0.32).toFixed(1) + 'px');
      });
    };
    window.addEventListener('scroll', onScroll, {passive: true});
    onScroll();
  }
}

/* Gallery: a thumbnail swaps places with the cover photo. */
page.addEventListener('click', e => {
  const btn = e.target.closest('.gallery .thumb');
  if (!btn) return;
  const gal = btn.closest('.gallery'), cover = gal.querySelector('.cover'), thumb = btn.querySelector('img');
  const was = cover.getAttribute('src');
  cover.setAttribute('src', thumb.getAttribute('src'));
  thumb.setAttribute('src', was);
  gal.querySelectorAll('.thumb').forEach(t => t.setAttribute('aria-pressed', t === btn ? 'true' : 'false'));
});
</script>
</body>
